<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trainer Dealer</title>
<style>
:root{--bg:#0f1f1a;--panel:#183029;--panel2:#20403a;--line:#2f544c;--text:#eef3ef;--mute:#ffffff;--gold:#e6bd55;--ok:#4fd08f;--bad:#f4736a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px 14px 48px}
h1{font-size:1.5rem;margin:6px 0 2px}
h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px}
p{margin:6px 0}
.mute{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;min-height:74px}
.tile b{display:block}
.tile span{color:var(--mute);font-size:.88rem}
.tile.main{background:var(--gold);border-color:var(--gold);color:#1c1608}
.tile.main span{color:#1c1608}
.tile:disabled{border-style:dashed;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
.btn.on{background:var(--gold);border-color:var(--gold);color:#1c1608;font-weight:600}
.btn.good{background:var(--ok);border-color:var(--ok);color:#06241a;font-weight:600}
.btn.wrong{background:var(--bad);border-color:var(--bad);color:#2b0806;font-weight:600}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1c1608;font-weight:700;width:100%;margin-top:14px;min-height:50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.top .info{color:var(--mute);font-variant-numeric:tabular-nums;font-size:.92rem;text-align:right}
.back{background:none;border:0;color:var(--mute);padding:8px 8px 8px 0;min-height:44px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.card{width:clamp(46px,13vw,62px);height:clamp(66px,18.5vw,88px);background:#fff;border-radius:8px;border:2px solid #fff;color:#14171c;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1;font-weight:700;box-shadow:0 1px 3px #0007}
.card .r{font-size:clamp(1.2rem,4.6vw,1.6rem)}
.card .s{font-size:clamp(1.3rem,5vw,1.75rem);margin-top:3px}
.card.red{color:#c8102e}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold);transform:translateY(-4px)}
.card.used{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.seat{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.seat.sel{border-color:var(--gold)}
.seat.win{border-color:var(--ok)}
.seat.miss{border-color:var(--bad)}
.seat .lbl{font-size:.85rem;color:var(--mute);display:block;margin-bottom:4px}
.seat .hand{font-size:.88rem;margin-top:6px;display:block}
.label{color:var(--mute);font-size:.85rem;margin-top:12px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.q ul{margin:6px 0;padding-left:20px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;font-size:.85rem}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.field label{flex:1}
.field input{width:150px;background:#0b1713;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;text-align:right;font-variant-numeric:tabular-nums}
.field input.good{border-color:var(--ok)}
.field input.wrong{border-color:var(--bad)}
.fix{color:var(--ok);font-size:.88rem;display:block;text-align:right}
.res{margin-top:14px;border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:var(--panel)}
.res.good{border-color:var(--ok)}
.res.wrong{border-color:var(--bad)}
.res b.t{display:block;margin-bottom:4px}
.res.good b.t{color:var(--ok)}
.res.wrong b.t{color:var(--bad)}
.hint{color:var(--bad);margin-top:10px;min-height:1.4em}
.big{font-size:2.4rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.su{white-space:nowrap}
.su.red{color:#ff8d94}
.table{position:relative;width:100%;aspect-ratio:3/4.3;margin:6px 0 12px}
.felt{position:absolute;inset:6% 8%;border-radius:999px;background:radial-gradient(ellipse at center,#1f8a5f 0%,#12694a 70%,#0d5439 100%);border:10px solid #6b4226;box-shadow:inset 0 0 0 2px #0006,0 4px 14px #0009}
.you{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:var(--gold);color:#1c1608;font-weight:700;font-size:.8rem;border-radius:8px;padding:2px 8px;z-index:3}
.at{position:absolute;left:var(--px);top:var(--py);transform:translate(-50%,-50%)}
.ts{--cw:clamp(33px,9vw,46px);z-index:2;background:#0d1c17;border:2px solid var(--line);border-radius:10px;padding:3px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text)}
.ts.big{--cw:clamp(44px,12vw,52px)}
.ts.sel,.ts.hot{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.ts.win{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.ts.miss{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.tn{font-size:.72rem;white-space:nowrap}
.hc{display:flex;gap:3px}
.table .card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:6px;box-shadow:0 1px 2px #0008}
.table .card .r{font-size:calc(var(--cw)*.42)}
.table .card .s{font-size:calc(var(--cw)*.44);margin-top:1px}
.cback{display:block;width:13px;height:18px;border-radius:3px;border:1px solid #fff;background:repeating-linear-gradient(45deg,#a81e2d 0 3px,#d6404f 3px 6px)}
.tag{font-size:.66rem;font-weight:700;border-radius:5px;padding:0 5px;background:var(--gold);color:#1c1608;white-space:nowrap}
.tag.fold{background:var(--bad);color:#2b0806}
.tnote{font-size:.68rem;white-space:nowrap}
.tb{z-index:1;background:#0d1c17;border:1px solid var(--gold);color:#fff;border-radius:999px;padding:0 7px;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dbtn{z-index:3;width:22px;height:22px;border-radius:50%;background:#fff;color:#14171c;font-weight:800;font-size:.75rem;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px #0008}
.mid{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;color:#fff}
.tboard{--cw:clamp(42px,11.5vw,62px);display:flex;gap:4px;flex-wrap:nowrap;justify-content:center}
.potlbl{background:#0d1c17;border:1px solid var(--gold);border-radius:10px;padding:3px 12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.stacks{display:flex;gap:10px;align-items:flex-end;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.pile{display:flex;flex-direction:column-reverse}
.disc{width:44px;height:7px;border-radius:4px;border:1px solid #0008;margin-top:-1px}
.col b{font-size:.75rem;background:#0d1c17;border-radius:5px;padding:0 5px}
.hands{margin-top:10px}
.hands div{margin-top:4px}
@media(min-width:560px){
  .table{aspect-ratio:16/10}
  .at{left:var(--lx);top:var(--ly)}
  .felt{inset:8% 7%}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
/*LOGIC-START*/
const RANKS='23456789TJQKA', SUITS='shdc';
const SYM={s:'♠︎',h:'♥︎',d:'♦︎',c:'♣︎'};
const CATS=['Carta alta','Coppia','Doppia coppia','Tris','Scala','Colore','Full','Poker','Scala colore'];
const RN=v=>({14:'A',13:'K',12:'Q',11:'J'}[v]||String(v));
const rv=c=>RANKS.indexOf(c[0])+2;
const al=v=>(v===14||v===8?"all'":'al ')+RN(v);
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>String(n).replace(/\B(?=(\d{3})+$)/g,'.');
const parseNum=s=>{const t=String(s).replace(/[.\s,]/g,'');return t===''?NaN:Number(t)};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deck(){const d=[];for(const r of RANKS)for(const s of SUITS)d.push(r+s);return shuffle(d)}
function deckMinus(used){return deck().filter(c=>!used.includes(c))}

function eval5(cs){
  const rs=cs.map(rv).sort((a,b)=>b-a);
  const flush=cs.every(c=>c[1]===cs[0][1]);
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g=Object.keys(cnt).map(r=>[+r,cnt[r]]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  let st=0;
  if(g.length===5){if(rs[0]-rs[4]===4)st=rs[0];else if(rs[0]===14&&rs[1]===5)st=5}
  if(st&&flush)return[8,st];
  if(g[0][1]===4)return[7,g[0][0],g[1][0]];
  if(g[0][1]===3&&g[1][1]===2)return[6,g[0][0],g[1][0]];
  if(flush)return[5,...rs];
  if(st)return[4,st];
  if(g[0][1]===3)return[3,g[0][0],g[1][0],g[2][0]];
  if(g[0][1]===2&&g[1][1]===2)return[2,g[0][0],g[1][0],g[2][0]];
  if(g[0][1]===2)return[1,g[0][0],g[1][0],g[2][0],g[3][0]];
  return[0,...rs];
}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
function best(cards){
  let top=null,five=null;const n=cards.length;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++)for(let e=d+1;e<n;e++){
    const h=[cards[a],cards[b],cards[c],cards[d],cards[e]],s=eval5(h);
    if(!top||cmp(s,top)>0){top=s;five=h}
  }
  return{score:top,five};
}
function describe(s){
  const t=s.slice(1).map(RN);
  switch(s[0]){
    case 0:return`Carta alta ${t[0]}, poi ${t.slice(1).join('-')}`;
    case 1:return`Coppia di ${t[0]}, kicker ${t.slice(1).join('-')}`;
    case 2:return`Doppia coppia ${t[0]} e ${t[1]}, kicker ${t[2]}`;
    case 3:return`Tris di ${t[0]}, kicker ${t.slice(1).join('-')}`;
    case 4:return`Scala ${al(s[1])}`;
    case 5:return`Colore ${al(s[1])} (${t.join('-')})`;
    case 6:return`Full di ${t[0]} con ${t[1]}`;
    case 7:return`Poker di ${t[0]}, kicker ${t[1]}`;
    default:return s[1]===14?'Scala reale':`Scala colore ${al(s[1])}`;
  }
}
function kickerFrom(cat){return{1:2,2:3,3:2,7:2}[cat]??99}
function winners(board,holes){
  const res=holes.map(h=>best(board.concat(h)));
  let top=res[0].score;res.forEach(r=>{if(cmp(r.score,top)>0)top=r.score});
  const win=res.map((r,i)=>cmp(r.score,top)===0?i:-1).filter(i=>i>=0);
  return{res,win,top};
}
function whyWin(board,holes){
  const{res,win,top}=winners(board,holes);
  if(win.length>1){
    if(cmp(top,eval5(board))===0)return'Gioca il board: nessuna carta in mano migliora le 5 sul tavolo, piatto diviso.';
    return'Piatto diviso: stesso punto, stesse 5 carte come valore.';
  }
  let second=null;res.forEach((r,i)=>{if(i!==win[0]&&(!second||cmp(r.score,second)>0))second=r.score});
  if(top[0]!==second[0])return`${CATS[top[0]]} batte ${CATS[second[0]].toLowerCase()}.`;
  for(let i=1;i<top.length;i++){
    if(top[i]!==second[i]){
      const k=i>=kickerFrom(top[0])?'il kicker':'la carta';
      return`Stessa categoria, decide ${k}: ${RN(top[i])} contro ${RN(second[i])}.`;
    }
  }
  return'';
}
function take(d,pred){const o=d.filter(pred);const c=o.length?pick(o):d[0];d.splice(d.indexOf(c),1);return c}
function trapBoard(){
  const d=deck(),R=()=>pick(RANKS),out=[];
  const byRank=r=>out.push(take(d,c=>c[0]===r));
  const any=()=>out.push(take(d,()=>true));
  const two=()=>{const a=R();let b=R();while(b===a)b=R();return[a,b]};
  const run=len=>{const lo=rint(-1,13-len),seq=[];for(let i=0;i<len;i++){const x=lo+i;seq.push(x<0?'A':RANKS[x])}return seq};
  const t=pick(['2p','trips','fullb','quads','f4','f5','st5','st4','wheel','sf']);
  const s=pick(SUITS);
  if(t==='2p'){const[a,b]=two();[a,a,b,b].forEach(byRank);any()}
  else if(t==='trips'){const[a]=two();[a,a,a].forEach(byRank);any();any()}
  else if(t==='fullb'){const[a,b]=two();[a,a,a,b,b].forEach(byRank)}
  else if(t==='quads'){const[a]=two();[a,a,a,a].forEach(byRank);any()}
  else if(t==='f4'){for(let i=0;i<4;i++)out.push(take(d,c=>c[1]===s));out.push(take(d,c=>c[1]!==s))}
  else if(t==='f5'){for(let i=0;i<5;i++)out.push(take(d,c=>c[1]===s))}
  else if(t==='st5'){run(5).forEach(byRank)}
  else if(t==='st4'){run(4).forEach(byRank);any()}
  else if(t==='wheel'){['A','2','3','4'].forEach(byRank);any()}
  else{run(3).forEach(r=>out.push(take(d,c=>c[0]===r&&c[1]===s)));any();any()}
  return shuffle(out);
}
const LV={easy:{hands:2,trap:0,side:3},normal:{hands:3,trap:.5,side:4},hard:{hands:4,trap:1,side:5}};
function genBoard(level){return Math.random()<LV[level].trap?trapBoard():deck().slice(0,5)}
function genWin(level){
  const n=LV[level].hands,board=genBoard(level),trap=LV[level].trap>0;
  let holes=[];
  for(let k=0;k<(trap?200:1);k++){
    const rest=deckMinus(board);
    holes=[];for(let i=0;i<n;i++)holes.push([rest[2*i],rest[2*i+1]]);
    if(!trap)break;
    const sc=holes.map(h=>best(board.concat(h)).score).sort((a,b)=>cmp(b,a));
    if(sc[0][0]===sc[1][0])break;
  }
  return{board,holes};
}
function genName(level){const board=genBoard(level),r=deckMinus(board);return{board,hole:[r[0],r[1]]}}
function boardInfo(board){
  const rs=board.map(rv);
  const paired=new Set(rs).size<rs.length;
  const sc={};board.forEach(c=>sc[c[1]]=(sc[c[1]]||0)+1);
  const flush=Object.values(sc).some(n=>n>=3);
  const set=new Set(rs);if(set.has(14))set.add(1);
  let straight=false;
  for(let lo=1;lo<=10;lo++){let k=0;for(let v=lo;v<lo+5;v++)if(set.has(v))k++;if(k>=3)straight=true}
  const rest=deckMinus(board);let top=null,hole=null;
  for(let i=0;i<rest.length;i++)for(let j=i+1;j<rest.length;j++){
    const s=best(board.concat([rest[i],rest[j]])).score;
    if(!top||cmp(s,top)>0){top=s;hole=[rest[i],rest[j]]}
  }
  return{paired,flush,straight,nut:top,nutHole:hole};
}
function genBoardRead(level){
  const len=pick([3,4,5,5]),b=genBoard(level==='easy'?'normal':level);
  return{board:shuffle(b).slice(0,len)};
}
const BLINDS=[[100,200],[200,400],[300,600],[500,1000],[1000,2000],[1500,3000],[2000,4000],[5000,10000]];
const unitOf=bb=>Math.max(100,bb/10);
const seatAt=(b,k)=>((b-1+k)%9)+1;
const mkTable=b=>({button:b,seats:[1,2,3,4,5,6,7,8,9].map(n=>({n}))});
const st=(t,n,o)=>Object.assign(t.seats.find(s=>s.n===n),o);
function actTable(o){
  const btn=rint(1,9),t=mkTable(btn);
  if(o.pre){st(t,seatAt(btn,1),{bet:o.sb,tag:o.sbFold?'FOLD':'SB'});st(t,seatAt(btn,2),{bet:o.bb,tag:'BB'})}
  const k=(o.pre?3:1)+rint(0,2),f=seatAt(btn,k);
  st(t,f,{bet:o.a,tag:o.pre?'RILANCIA':'PUNTA'});
  if(o.b)st(t,seatAt(btn,k+1),{bet:o.b,tag:o.tag2||'RILANCIA'});
  const nx=o.hot?seatAt(btn,o.hot):(o.back?f:seatAt(btn,k+(o.b?2:1)));
  st(t,nx,{hot:true});
  return t;
}
function limpTable(sb,bb){
  const btn=rint(1,9),t=mkTable(btn);
  st(t,seatAt(btn,1),{bet:sb,tag:'SB',hot:true});st(t,seatAt(btn,2),{bet:bb,tag:'BB'});
  for(let k=3;k<=9;k++)st(t,seatAt(btn,k),{bet:bb,tag:'CHIAMA'});
  return t;
}
function genMinRaise(level){
  const[sb,bb]=pick(BLINDS),u=unitOf(bb);
  const k=pick(level==='easy'?['limp','open','post']:['open','re','short','post','postre','postshort']);
  const open=bb*rint(2,4)+u*rint(0,4);
  let lines,ans,why,table;
  if(k==='limp'){lines=['Preflop: tutti chiamano il BB, nessun rilancio.'];table=limpTable(sb,bb);ans=bb*2;why=`Il rilancio minimo vale un BB: ${fmt(bb)} + ${fmt(bb)}.`}
  else if(k==='open'){const r=open-bb;lines=[`Preflop: il primo rilancia a ${fmt(open)}.`];table=actTable({pre:1,sb,bb,a:open});ans=open+r;why=`L'ultimo rilancio vale ${fmt(open)} − ${fmt(bb)} = ${fmt(r)}, quindi ${fmt(open)} + ${fmt(r)}.`}
  else if(k==='re'){const r0=open-bb,y=open+r0+u*rint(0,20),r=y-open;lines=[`Preflop: il primo rilancia a ${fmt(open)}.`,`Il secondo rilancia a ${fmt(y)}.`];table=actTable({pre:1,sb,bb,a:open,b:y});ans=y+r;why=`L'ultimo rilancio vale ${fmt(y)} − ${fmt(open)} = ${fmt(r)}, quindi ${fmt(y)} + ${fmt(r)}.`}
  else if(k==='short'){const r0=open-bb,steps=Math.max(1,Math.floor((r0-1)/u)),z=open+u*rint(1,steps);lines=[`Preflop: il primo rilancia a ${fmt(open)}.`,`Il secondo va all-in per ${fmt(z)}: rilancio incompleto.`];table=actTable({pre:1,sb,bb,a:open,b:z,tag2:'ALL-IN'});ans=z+r0;why=`L'all-in corto non cambia la misura: resta l'ultimo rilancio pieno di ${fmt(r0)}, quindi ${fmt(z)} + ${fmt(r0)}.`}
  else if(k==='post'){const b=bb*rint(1,6)+u*rint(0,4);lines=[`Dopo il flop: il primo punta ${fmt(b)}.`];table=actTable({a:b});ans=b*2;why=`La puntata vale ${fmt(b)}, quindi ${fmt(b)} + ${fmt(b)}.`}
  else if(k==='postre'){const b=bb*rint(1,6),y=b*2+u*rint(0,20),r=y-b;lines=[`Dopo il flop: il primo punta ${fmt(b)}.`,`Il secondo rilancia a ${fmt(y)}.`];table=actTable({a:b,b:y});ans=y+r;why=`L'ultimo rilancio vale ${fmt(y)} − ${fmt(b)} = ${fmt(r)}, quindi ${fmt(y)} + ${fmt(r)}.`}
  else{const b=bb*rint(2,6),steps=Math.max(1,Math.floor((b-1)/u)),z=b+u*rint(1,steps);lines=[`Dopo il flop: il primo punta ${fmt(b)}.`,`Il secondo va all-in per ${fmt(z)}: rilancio incompleto.`];table=actTable({a:b,b:z,tag2:'ALL-IN'});ans=z+b;why=`L'all-in corto non cambia la misura: resta la puntata di ${fmt(b)}, quindi ${fmt(z)} + ${fmt(b)}.`}
  return{title:'Il prossimo vuole rilanciare',head:`Bui ${fmt(sb)}/${fmt(bb)}.`,lines,table,fields:[{label:'Rilancio minimo a',answer:ans}],why:[why]};
}
function genCall(){
  const[sb,bb]=pick(BLINDS),u=unitOf(bb);
  const x=bb*rint(2,4)+u*rint(0,4),k=pick(['sb','bb','re','post']);
  let lines,ans,why,table;
  if(k==='sb'){lines=[`Rilancio a ${fmt(x)}, tutti foldano fino allo small blind.`];table=actTable({pre:1,sb,bb,a:x,hot:1});ans=x-sb;why=`Ha già ${fmt(sb)} davanti: ${fmt(x)} − ${fmt(sb)}.`}
  else if(k==='bb'){lines=[`Rilancio a ${fmt(x)}, si arriva al big blind che ha pagato anche il BB ante.`];table=actTable({pre:1,sb,bb,a:x,hot:2,sbFold:1});ans=x-bb;why=`L'ante è morto e non conta per il call: ${fmt(x)} − ${fmt(bb)}.`}
  else if(k==='re'){const y=x+(x-bb)+u*rint(0,15);lines=[`Il primo rilancia a ${fmt(x)}, il secondo rilancia a ${fmt(y)}.`,'Tocca di nuovo al primo.'];table=actTable({pre:1,sb,bb,a:x,b:y,back:1});ans=y-x;why=`Ha già ${fmt(x)} davanti: ${fmt(y)} − ${fmt(x)}.`}
  else{const b=bb*rint(1,5),y=b*2+u*rint(0,15);lines=[`Al flop il primo punta ${fmt(b)}, il secondo rilancia a ${fmt(y)}.`,'Tocca di nuovo al primo.'];table=actTable({a:b,b:y,back:1});ans=y-b;why=`Ha già ${fmt(b)} davanti: ${fmt(y)} − ${fmt(b)}.`}
  return{title:'Quanto deve aggiungere per chiamare?',head:`Bui ${fmt(sb)}/${fmt(bb)}.`,lines,table,fields:[{label:'Da aggiungere',answer:ans}],why:[why]};
}
function genPot(level){
  const[sb,bb]=pick(BLINDS),u=unitOf(bb),seats=rint(6,9);
  const ante=level==='easy'?'none':pick(['none','bb','bb','each']);
  const lines=[],calc=[];let pot=0;
  if(ante==='bb'){lines.push(`BB ante: ${fmt(bb)}.`);pot+=bb;calc.push(`ante ${fmt(bb)}`)}
  if(ante==='each'){const a=Math.max(100,Math.round(bb/1000)*100);lines.push(`Ante ${fmt(a)} a testa, ${seats} giocatori.`);pot+=a*seats;calc.push(`ante ${fmt(a)} × ${seats} = ${fmt(a*seats)}`)}
  const x=bb*rint(2,4)+u*rint(0,3);
  let c=rint(0,2);const sc=Math.random()<.5,bc=Math.random()<.5;
  if(!c&&!sc&&!bc)c=1;
  lines.push(`Un giocatore rilancia a ${fmt(x)}.`);
  if(c)lines.push(`${c===1?'Un altro chiama':c+' giocatori chiamano'}, gli altri foldano.`);
  lines.push(sc?'Lo small blind chiama.':`Lo small blind folda (lascia ${fmt(sb)}).`);
  lines.push(bc?'Il big blind chiama.':`Il big blind folda (lascia ${fmt(bb)}).`);
  const inn=1+c+(sc?1:0)+(bc?1:0);
  const occ=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,seats).sort((a,b)=>a-b),bi=rint(0,seats-1),at=k=>occ[(bi+k)%seats];
  const table={button:occ[bi],seats:occ.map(n=>({n,tag:'FOLD'}))};
  const kr=rint(3,seats-c),alive=[];
  st(table,at(kr),{bet:x,tag:'RILANCIA'});alive.push(at(kr));
  for(let i=1;i<=c;i++){st(table,at(kr+i),{bet:x,tag:'CHIAMA'});alive.push(at(kr+i))}
  st(table,at(1),sc?{bet:x,tag:'CHIAMA'}:{bet:sb,tag:'FOLD'});if(sc)alive.push(at(1));
  st(table,at(2),bc?{bet:x,tag:'CHIAMA'}:{bet:bb,tag:'FOLD'});if(bc)alive.push(at(2));
  if(ante==='bb')st(table,at(2),{note:'BB ante'});
  pot+=x*inn;calc.push(`${fmt(x)} × ${inn} = ${fmt(x*inn)}`);
  if(!sc){pot+=sb;calc.push(`SB morto ${fmt(sb)}`)}
  if(!bc){pot+=bb;calc.push(`BB morto ${fmt(bb)}`)}
  if(level!=='easy'&&Math.random()<.6){
    const b=Math.max(bb,Math.round(pot/2/bb)*bb),k=rint(1,inn-1);
    lines.push(`Al flop uno punta ${fmt(b)}, ${k===1?'uno chiama':k+' chiamano'}, gli altri foldano.`);
    pot+=b*(1+k);calc.push(`${fmt(b)} × ${1+k} = ${fmt(b*(1+k))}`);
    alive.slice(0,1+k).forEach(n=>st(table,n,{note:`flop ${fmt(b)}`}));
  }
  return{title:'Quanto c\'è nel piatto?',head:`Bui ${fmt(sb)}/${fmt(bb)}.`,lines,table,fields:[{label:'Piatto totale',answer:pot}],why:[calc.join(' + ')+` = ${fmt(pot)}.`]};
}
function genChips(level){
  const set=pick([[100,500,1000,5000],[500,1000,5000,25000],[25,100,500,1000]]);
  const use=level==='easy'?set.slice(0,2):set;
  const lines=[],parts=[];let t=0;
  use.forEach(v=>{const n=rint(level==='easy'?2:1,level==='hard'?23:12);lines.push(`${n} fiches da ${fmt(v)}`);parts.push(fmt(n*v));t+=n*v});
  const stacks=lines.map((l,i)=>({v:use[i],n:parseInt(l,10)}));
  return{title:'Conta lo stack',head:'',lines,stacks,fields:[{label:'Totale',answer:t}],why:[parts.join(' + ')+` = ${fmt(t)}.`]};
}
function splitPot(pot,chip,seats,button){
  const order=seats.slice().sort((a,b)=>((a-button+8)%9)-((b-button+8)%9));
  const chips=pot/chip,base=Math.floor(chips/seats.length),extra=chips%seats.length;
  const pay={};order.forEach((s,i)=>pay[s]=(base+(i<extra?1:0))*chip);
  return{pay,order,extra};
}
function genOdd(level){
  const n=level==='easy'?2:pick([2,3]),chip=pick([100,500,1000]);
  let chips=rint(21,240);while(chips%n===0)chips++;
  const seats=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,n).sort((a,b)=>a-b);
  const button=rint(1,9),pot=chips*chip;
  const{pay,order,extra}=splitPot(pot,chip,seats,button);
  const table=mkTable(button);table.pot=pot;
  seats.forEach(s=>st(table,s,{tag:'DIVIDE',hot:true}));
  return{title:'Piatto diviso con fiche dispari',head:'',table,
    lines:[`Piatto ${fmt(pot)}, fiche più piccola in gioco: ${fmt(chip)}.`,`Bottone al posto ${button}.`,`Dividono i posti ${seats.join(', ')}.`],
    fields:seats.map(s=>({label:`Posto ${s}`,answer:pay[s]})),
    why:[`${chips} fiches da ${fmt(chip)} tra ${n}: ne avanza${extra>1?'no':''} ${extra}.`,`Regola TDA 21-A (hold'em): la fiche in più va al primo posto a sinistra del bottone, poi al successivo. Dal bottone ${button} l'ordine è ${order.join(', ')}.`]};
}
function computePots(players){
  const act=players.filter(p=>!p.folded);
  const levels=[...new Set(act.map(p=>p.c))].sort((a,b)=>a-b);
  let prev=0,refund=null;const pots=[];
  levels.forEach(L=>{
    const amount=players.reduce((s,p)=>s+Math.min(p.c,L)-Math.min(p.c,prev),0);
    const elig=act.filter(p=>p.c>=L).map(p=>p.name);
    if(elig.length===1)refund={name:elig[0],amount};else pots.push({amount,elig,step:L-prev});
    prev=L;
  });
  return{pots,refund};
}
function payouts(players,order){
  const{pots,refund}=computePots(players),pay={},lines=[];
  players.forEach(p=>pay[p.name]=0);
  pots.forEach((p,i)=>{const w=order.find(n=>p.elig.includes(n));pay[w]+=p.amount;lines.push({i,w,amount:p.amount})});
  if(refund)pay[refund.name]+=refund.amount;
  return{pay,lines,refund};
}
const potName=i=>i===0?'Piatto principale':`Side pot ${i}`;
function sideScenario(level){
  const n=LV[level].side,seats=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,n+1).sort((a,b)=>a-b);
  const step=pick([100,500,1000]);
  const cs=[];while(cs.length<n){const v=rint(8,80)*step;if(!cs.includes(v))cs.push(v)}
  if(Math.random()<.3){cs.sort((a,b)=>a-b);const i=rint(0,n-2);cs[i]=cs[i+1]}
  const sh=shuffle(cs);
  const players=sh.map((c,i)=>({name:`Posto ${seats[i]}`,n:seats[i],c,folded:false}));
  if(level==='hard'){const low=Math.min(...cs);players.push({name:`Posto ${seats[n]}`,n:seats[n],c:Math.max(step,Math.floor(low/2/step)*step),folded:true})}
  return players;
}
const sideTable=pl=>({seats:pl.map(p=>({n:p.n,bet:p.c,tag:p.folded?'FOLD':'ALL-IN'}))});
const sideLines=pl=>pl.map(p=>p.folded?`${p.name}: ha messo ${fmt(p.c)} e poi ha foldato`:`${p.name}: all-in per ${fmt(p.c)}`);
function genSide(level){
  const pl=sideScenario(level),{pots,refund}=computePots(pl);
  const fields=pots.map((p,i)=>({label:potName(i),answer:p.amount}));
  if(refund)fields.push({label:`Restituiti al ${refund.name}`,answer:refund.amount});
  const why=pots.map((p,i)=>{const k=p.elig.length,dead=p.amount-p.step*k;return`${potName(i)}: ${fmt(p.step)} × ${k}${dead?` + ${fmt(dead)} morti`:''} = ${fmt(p.amount)} (${p.elig.join(', ')})`});
  if(refund)why.push(`${refund.name}: i ${fmt(refund.amount)} in più non li copre nessuno, tornano indietro, non sono un piatto.`);
  return{title:'Dividi i piatti',head:'',lines:sideLines(pl),shown:[],table:sideTable(pl),fields,why};
}
function genPay(level){
  const pl=sideScenario(level),act=pl.filter(p=>!p.folded),order=shuffle(act.map(p=>p.name));
  const{pay,lines,refund}=payouts(pl,order);
  const why=lines.slice().reverse().map(l=>`${potName(l.i)} (${fmt(l.amount)}) al ${l.w}`);
  if(refund)why.push(`${fmt(refund.amount)} restituiti al ${refund.name}`);
  why.push('Di solito si paga dall\'ultimo side pot verso il principale.');
  const table=sideTable(pl),rank=`Mani dalla migliore alla peggiore: ${order.join(' > ')}.`;
  order.forEach((nm,i)=>st(table,pl.find(p=>p.name===nm).n,{tag:`${i+1}ª MANO`}));
  return{title:'Quanto prende ognuno?',head:'',lines:[...sideLines(pl),rank],shown:[rank],table,
    fields:act.map(p=>({label:p.name,answer:pay[p.name]})),why};
}

    const f=q.fields.map((x,i)=>{
      const v=cur.vals[i]??'',ok=done&&parseNum(v)===x.answer;
      return h('div',{class:'field'},h('label',{for:'f'+i},x.label),
        h('div',null,h('input',{id:'f'+i,inputmode:'numeric',autocomplete:'off',value:v,readonly:!!done,class:done?(ok?'good':'wrong'):null}),
          done&&!ok&&h('span',{class:'fix'},fmt(x.answer))));
    });
    const shown=q.shown||q.lines;
    return[q.table&&numTable(q.table),q.stacks&&chipTable(q.stacks),
      h('div',{class:'q'},h('b',null,q.title),q.head&&h('p',{class:'mute'},q.head),shown.length?h('ul',null,shown.map(l=>h('li',null,l))):null),f];
  }
};
const isNum=t=>!['win','name','board'].includes(t);
function render(){show(header(),R[isNum(cur.type)?'num':cur.type](),footer())}
const G={
  win(){
    const{board,holes}=cur.q;if(!cur.a.seats.length)return null;
    const w=winners(board,holes),a=cur.a.seats.slice().sort(),b=w.win.slice().sort();
    return{ok:a.join()===b.join(),body:[whyWin(board,holes)]};
  },
  name(){
    const{board,hole}=cur.q;
    if(cur.a.cat==null||cur.a.cards.length!==5)return null;
    const b=best(board.concat(hole)),mine=eval5(cur.a.cards);
    const ok=cur.a.cat===b.score[0]&&cmp(mine,b.score)===0;
    const body=[];
    if(cur.a.cat===b.score[0]&&!ok)body.push(`Categoria giusta, carte no: con le tue fai ${describe(mine).toLowerCase()}.`,h('br'));
    body.push(`${describe(b.score)}: `,fiveEl(b.five));
    return{ok,body};
  },
  board(){
    const a=cur.a;if(a.paired==null||a.flush==null||a.straight==null||a.cat==null)return null;
    const i=boardInfo(cur.q.board);
    const ok=a.paired===i.paired&&a.flush===i.flush&&a.straight===i.straight&&a.cat===i.nut[0];
    return{ok,body:[`Il massimo è ${describe(i.nut).toLowerCase()}, per esempio con `,spaced(i.nutHole),'.']};
  },
  num(){
    const q=cur.q;
    q.fields.forEach((f,i)=>{cur.vals[i]=document.getElementById('f'+i).value.trim()});
    if(q.fields.some((f,i)=>Number.isNaN(parseNum(cur.vals[i]))))return null;
    return{ok:q.fields.every((f,i)=>parseNum(cur.vals[i])===f.answer),body:q.why.map(l=>h('div',null,l))};
  }
};
function confirmQ(){
  const r=G[isNum(cur.type)?'num':cur.type]();
  if(!r){document.getElementById('hint').textContent='Manca ancora qualcosa da rispondere.';return}
  r.ms=Date.now()-cur.t0;cur.res=r;
  const s=store.stats[cur.type]||(store.stats[cur.type]={n:0,ok:0,ms:0});
  s.n++;s.ms+=r.ms;if(r.ok)s.ok++;
  const d=store.days[today()]||(store.days[today()]={n:0,ok:0});d.n++;if(r.ok)d.ok++;
  ses.done++;ses.ms+=r.ms;if(r.ok)ses.ok++;else ses.miss[cur.type]=(ses.miss[cur.type]||0)+1;
  if(ses.mode==='review'){if(r.ok)store.errors=store.errors.filter(e=>e.id!==cur.id)}
  else if(!r.ok){store.errors.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),type:cur.type,q:cur.q});store.errors=store.errors.slice(0,40)}
  save();render();
  const x=app.querySelector('.res');if(x)x.scrollIntoView({block:'nearest'});
}
function summary(){
  clearInterval(timer);
  const pct=ses.done?Math.round(ses.ok/ses.done*100):0,avg=ses.done?(ses.ms/ses.done/1000).toFixed(1):'0';
  const m=Object.keys(ses.miss).sort((a,b)=>ses.miss[b]-ses.miss[a]);
  show(h('h1',null,'Sessione finita'),h('p',{class:'big'},pct+'%'),h('p',null,`${ses.ok} giuste su ${ses.done}, ${avg}s a domanda.`),
    m.length?[h('h2',null,'Dove hai sbagliato'),h('table',null,m.map(k=>h('tr',null,h('td',null,TYPES[k].n),h('td',null,String(ses.miss[k])))))]:h('p',null,'Nessun errore.'),
    h('button',{class:'btn primary','data-act':'home'},'Torna al menu'));
  ses=null;cur=null;
}
function stats(){
  clearInterval(timer);
  const rows=Object.keys(TYPES).map(k=>{
    const s=store.stats[k];
    return h('tr',null,h('td',null,TYPES[k].n),h('td',null,String(s?s.n:0)),h('td',null,s?Math.round(s.ok/s.n*100)+'%':'–'),h('td',null,s?(s.ms/s.n/1000).toFixed(1)+'s':'–'));
  });
  const t=store.days[today()];
  show(h('div',{class:'top'},h('button',{class:'back','data-act':'home'},'‹ Menu')),h('h1',null,'Statistiche'),
    h('p',{class:'mute'},`Oggi: ${t?`${t.ok} giuste su ${t.n}`:'ancora niente'}. Giorni di fila: ${streak()}.`),
    h('table',null,h('tr',null,['Esercizio','Fatte','Giuste','Tempo'].map(x=>h('th',null,x))),rows),
    h('button',{class:'btn',style:'margin-top:20px','data-act':'reset'},'Azzera tutto'));
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v;
  if(act==='home')return home();
  if(act==='start')return start(v);
  if(act==='stats')return stats();
  if(act==='level'){store.level=v;save();return home()}
  if(act==='reset'){if(confirm('Azzero statistiche ed errori salvati?')){store={stats:{},days:{},errors:[],level:store.level};save();stats()}return}
  if(act==='confirm')return confirmQ();
  if(act==='next')return next();
  if(!cur||cur.res)return;
  if(act==='seat'){const i=+v,s=cur.a.seats;s.includes(i)?s.splice(s.indexOf(i),1):s.push(i)}
  if(act==='card'){const s=cur.a.cards;if(s.includes(v))s.splice(s.indexOf(v),1);else if(s.length<5)s.push(v)}
  if(act==='cat')cur.a.cat=+v;
  if(act==='yn')cur.a[b.dataset.k]=v==='1';
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!cur||e.target.tagName==='BUTTON')return;
  e.preventDefault();cur.res?next():confirmQ();
});
home();
</script>
